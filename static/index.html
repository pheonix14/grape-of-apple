<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visionOS Web Clone - Ultimate</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-transparent backdrop-blur-[50px] border border-white/10 shadow-2xl;
            }
            .interactable {
                @apply transition-all duration-300 ease-out cursor-pointer;
            }
            .interactable.clicked {
                @apply scale-95 opacity-80;
            }
            .bg-gradient-1 { background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%); }
            .bg-gradient-2 { background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%); }
            .bg-gradient-4 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden bg-black select-none text-white transition-colors duration-500 dynamic-text tron-ares-bw">
    <div class="absolute inset-0 z-0">
        <video id="input_video" class="w-full h-full object-cover" autoplay playsinline></video>
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none scale-x-[-1] opacity-30"></canvas>
    </div>

    <!-- Left Sidebar Toolbar -->
    <div class="sidebar-toolbar absolute top-1/2 -translate-y-1/2 left-8 z-50 pointer-events-auto flex flex-col gap-6 transition-all duration-500 origin-left">
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" id="fullscreen-btn" title="Toggle Fullscreen">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        </div>
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" id="settings-btn" title="Control Center">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" data-app="music" title="Music Player">
            <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" data-app="mic" id="btn-mic-toggle" title="Voice Search">
            <svg class="w-7 h-7 text-white" id="mic-icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        </div>
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" data-app="map" title="Spatial Map">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="absolute top-1/2 left-32 -translate-y-1/2 z-50 w-[450px] glass-panel p-8 rounded-[40px] opacity-0 -translate-x-4 pointer-events-none transition-all duration-300 shadow-2xl">
        <div class="flex flex-col gap-8">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-bold tracking-tight">Control Center</h2>
                <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                </div>
            </div>

            <!-- Settings Grid -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Panel Size -->
                <div class="flex flex-col gap-3 p-6 bg-white/5 rounded-3xl border border-white/10">
                    <span class="text-xs font-bold uppercase tracking-widest text-white/50">Display Scale</span>
                    <div class="flex gap-2">
                        <button id="btn-size-down" class="interactable flex-1 h-16 bg-white/10 hover:bg-white/20 rounded-2xl text-2xl font-bold">-</button>
                        <button id="btn-size-up" class="interactable flex-1 h-16 bg-white/10 hover:bg-white/20 rounded-2xl text-2xl font-bold">+</button>
                    </div>
                </div>

                <!-- Text Size -->
                <div class="flex flex-col gap-3 p-6 bg-white/5 rounded-3xl border border-white/10">
                    <span class="text-xs font-bold uppercase tracking-widest text-white/50">Text Size</span>
                    <div class="flex gap-2">
                        <button id="btn-text-down" class="interactable flex-1 h-16 bg-white/10 hover:bg-white/20 rounded-2xl text-2xl font-bold">-</button>
                        <button id="btn-text-up" class="interactable flex-1 h-16 bg-white/10 hover:bg-white/20 rounded-2xl text-2xl font-bold">+</button>
                    </div>
                </div>

                <!-- Appearance / Themes -->
                <div class="col-span-2 flex flex-col gap-4 p-6 bg-white/5 rounded-3xl border border-white/10">
                    <span class="text-xs font-bold uppercase tracking-widest text-white/50">Appearance Themes</span>
                    <div class="grid grid-cols-3 gap-3">
                        <button id="btn-theme-normal" class="interactable h-20 bg-white/10 hover:bg-white/20 rounded-2xl flex flex-col items-center justify-center gap-1">
                            <div class="w-4 h-4 rounded-full bg-white/80"></div>
                            <span class="text-[10px] font-bold">Normal</span>
                        </button>
                        <button id="btn-theme-legacy" class="interactable h-20 bg-cyan-500/20 hover:bg-cyan-500/30 rounded-2xl flex flex-col items-center justify-center gap-1 border border-cyan-500/30">
                            <div class="w-4 h-4 rounded-full bg-cyan-400"></div>
                            <span class="text-[10px] font-bold">Legacy</span>
                        </button>
                        <button id="btn-theme-ares-rb" class="interactable h-20 bg-red-600/20 hover:bg-red-600/30 rounded-2xl flex flex-col items-center justify-center gap-1 border border-red-600/30">
                            <div class="w-4 h-4 rounded-full bg-red-500"></div>
                            <span class="text-[10px] font-bold">Ares RB</span>
                        </button>
                        <button id="btn-theme-ares-rw" class="interactable h-20 bg-red-100/10 hover:bg-red-100/20 rounded-2xl flex flex-col items-center justify-center gap-1 border border-red-400/30">
                            <div class="w-4 h-4 rounded-full bg-white border border-red-500"></div>
                            <span class="text-[10px] font-bold">Ares RW</span>
                        </button>
                        <button id="btn-theme-ares-bw" class="interactable h-20 bg-blue-100/10 hover:bg-blue-100/20 rounded-2xl flex flex-col items-center justify-center gap-1 border border-blue-400/30">
                            <div class="w-4 h-4 rounded-full bg-white border border-blue-500"></div>
                            <span class="text-[10px] font-bold">Ares BW</span>
                        </button>
                        <div class="flex items-center justify-center p-2 bg-white/5 rounded-2xl">
                             <input type="color" id="border-color-picker" class="w-full h-full bg-transparent cursor-pointer interactable">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Music Hub -->
    <div id="music-player" class="absolute inset-0 z-40 pointer-events-auto flex items-center justify-center transition-all duration-500 hidden p-32">
        <div class="music-bg glass-panel p-10 rounded-[40px] w-full h-full flex flex-col gap-8 relative overflow-hidden shadow-2xl">
            <div class="music-controls flex justify-between items-center w-full">
                <h2 class="text-4xl font-bold tracking-tight flex items-center gap-4">
                    <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    Media Hub
                </h2>
                <div class="flex gap-4">
                    <button id="btn-minimize" class="interactable bg-white/10 hover:bg-white/20 w-16 h-16 rounded-full flex items-center justify-center border border-white/20">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 12H6"></path></svg>
                    </button>
                    <button id="btn-close" class="interactable bg-white/10 hover:bg-white/20 w-16 h-16 rounded-full flex items-center justify-center border border-white/20">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex flex-1 gap-10">
                <!-- Left: Library & Inputs -->
                <div class="flex-[1] flex flex-col gap-6">
                    <div class="flex items-center gap-4 bg-white/5 rounded-3xl px-6 py-4 border border-white/10">
                        <input type="text" id="yt-link-input" placeholder="Paste YouTube link here..." class="bg-transparent outline-none border-none text-xl w-full text-white placeholder-white/30">
                        <button id="btn-yt-load" class="interactable text-lg font-bold px-6 py-2 bg-white/10 rounded-2xl hover:bg-white/20">LOAD</button>
                    </div>

                    <div id="media-list" class="flex-1 flex flex-col gap-3 overflow-y-auto px-4 py-2 glass-panel rounded-[32px] border-white/5 scrollbar-hide">
                        <div class="text-sm opacity-50 uppercase tracking-widest mb-2 font-bold">Local Library</div>
                        <!-- Songs injected by JS -->
                    </div>

                    <label class="interactable bg-white/10 hover:bg-white/20 px-8 py-5 rounded-[24px] cursor-pointer text-xl font-bold flex items-center justify-center gap-3 border border-white/10">
                        Upload New Music
                        <input type="file" id="music-file-input" accept="audio/*" class="hidden">
                    </label>
                </div>

                <!-- Right: Visualizer & Player -->
                <div class="flex-[2] flex flex-col gap-6 items-center justify-center glass-panel rounded-[40px] p-10 bg-black/20">
                    <div id="yt-player-container" class="hidden w-full aspect-video rounded-3xl overflow-hidden shadow-2xl border border-white/10">
                        <iframe id="yt-iframe" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>

                    <canvas id="visualizer-canvas" class="w-full h-64 rounded-3xl"></canvas>

                    <div class="flex items-center gap-12 mt-4">
                        <button id="btn-loop" class="interactable bg-white/5 hover:bg-white/10 w-20 h-20 rounded-full flex items-center justify-center border border-white/5 shadow-inner">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                        <button id="btn-play" class="interactable bg-white/20 hover:bg-white/30 w-32 h-32 rounded-full flex items-center justify-center shadow-2xl border border-white/30 scale-110">
                            <svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <audio id="audio-element" class="hidden"></audio>
    </div>
    
    <!-- Mini Player (Minimized State: Only Transparent Visualizer) -->
    <div id="mini-player" class="absolute bottom-10 right-10 z-[100] hidden transition-all duration-300 w-48 h-24 overflow-hidden pointer-events-auto">
        <canvas id="mini-visualizer-canvas" class="w-full h-full interactable" title="Double click to maximize"></canvas>
    </div>

    <!-- Fullscreen Map Window -->
    <div id="map-window" class="absolute inset-0 z-30 pointer-events-auto flex items-center justify-center transition-all duration-500 hidden p-24">
        <!-- Main Map Panel -->
        <div class="glass-panel p-2 rounded-[40px] w-full h-full flex flex-col relative overflow-hidden shadow-2xl">
            <div class="absolute top-6 left-6 right-6 z-[999] flex justify-between items-start pointer-events-none">
                <div class="pointer-events-auto flex flex-col gap-4">
                    <div class="flex items-center gap-2 bg-black/60 backdrop-blur rounded-full px-6 py-3 border border-white/20 shadow-lg">
                        <input type="text" id="map-search-input" placeholder="Search locations..." class="bg-transparent outline-none border-none text-lg w-64 text-white placeholder-white/50">
                        <button id="btn-map-search" class="interactable text-sm font-bold px-4 py-1.5 bg-white/20 rounded-full hover:bg-white/30 ml-2">GO</button>
                    </div>
                </div>

                <button id="btn-map-close" class="interactable pointer-events-auto bg-black/60 backdrop-blur text-white hover:bg-white/20 w-14 h-14 rounded-full flex items-center justify-center shadow-lg border border-white/20">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div id="map-container" class="w-full h-full rounded-[36px] overflow-hidden"></div>
            
            <!-- Real-time Search Results Overlay -->
            <div id="map-search-results" class="absolute top-24 left-6 z-[1000] w-72 flex flex-col gap-2 pointer-events-auto max-h-[50%] overflow-y-auto scrollbar-hide hidden"></div>
            
            <!-- Tactical Intel Panel (Right Side) -->
            <div id="tactical-intel" class="absolute top-24 right-6 z-[1000] w-96 flex flex-col gap-4 pointer-events-auto max-h-[80%] overflow-y-auto scrollbar-hide hidden">
                <div class="glass-panel p-6 rounded-[32px] border-blue-400/30 bg-blue-400/5 backdrop-blur-xl">
                    <h2 id="intel-name" class="text-2xl font-bold mb-1">Sector Name</h2>
                    <p id="intel-category" class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-4">Category</p>
                    
                    <div class="flex flex-col gap-6">
                        <section id="intel-stories-section">
                            <h3 class="text-xs font-bold opacity-50 uppercase tracking-widest mb-2">Tactical Lore</h3>
                            <div id="intel-stories" class="flex flex-col gap-2"></div>
                        </section>
                        <section id="intel-reviews-section">
                            <h3 class="text-xs font-bold opacity-50 uppercase tracking-widest mb-2">SITREPs (Reviews)</h3>
                            <div id="intel-reviews" class="flex flex-col gap-2"></div>
                        </section>
                        <section id="intel-reports-section">
                            <h3 class="text-xs font-bold opacity-50 uppercase tracking-widest mb-2">Transport Logistics</h3>
                            <div id="intel-reports" class="flex flex-col gap-2"></div>
                        </section>
                    </div>
                </div>
            </div>

            <!-- Route Options List -->
            <div id="route-list" class="absolute top-24 left-6 z-[999] w-72 flex flex-col gap-2 pointer-events-auto max-h-[60%] overflow-y-auto scrollbar-hide"></div>
            
            <!-- Route Info Overlay (Bottom Left) -->
            <div id="map-route-info" class="absolute bottom-6 left-6 z-[999] pointer-events-none hidden">
                <div class="bg-black/60 backdrop-blur-md p-4 rounded-2xl border border-white/20 shadow-xl flex flex-col gap-1 min-w-[200px]">
                    <div class="text-white/60 text-xs font-bold uppercase tracking-widest">Route Info</div>
                    <div id="route-distance" class="text-white text-2xl font-bold">-- km</div>
                    <div id="route-time" class="text-blue-400 text-lg hidden">-- min</div>
                </div>
            </div>
        </div>

        <!-- Big Controls (Outside Map Panel - Top Center Bar) -->
        <div class="absolute top-8 left-1/2 -translate-x-1/2 z-[1000] flex flex-row gap-4 bg-black/40 backdrop-blur-md p-2 rounded-[32px] border border-white/10 shadow-2xl">
            <button id="btn-map-zoom-in" class="interactable bg-black/60 text-white hover:bg-white/20 w-20 h-16 rounded-2xl flex items-center justify-center border border-white/20 text-3xl font-bold">+</button>
            <button id="btn-map-zoom-out" class="interactable bg-black/60 text-white hover:bg-white/20 w-20 h-16 rounded-2xl flex items-center justify-center border border-white/20 text-3xl font-bold">-</button>
            <button id="btn-map-locate" title="Locate Me" class="interactable bg-black/60 text-white hover:bg-white/20 w-20 h-16 rounded-2xl flex items-center justify-center border border-white/20">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </button>
            <button id="btn-map-marker" title="Place Marker" class="interactable bg-black/60 text-white hover:bg-white/20 w-20 h-16 rounded-2xl flex items-center justify-center border border-white/20">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <button id="btn-map-clear" title="Clear All Markers" class="interactable bg-black/60 text-red-400 hover:bg-white/20 w-20 h-16 rounded-2xl flex items-center justify-center border border-white/20">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
    </div>

    <!-- Virtual Keyboard Overlay -->
    <div id="keyboard-overlay" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 z-[1000] pointer-events-auto hidden flex flex-col gap-2 p-6 glass-panel rounded-[32px] w-[800px] transition-all duration-300">
        <!-- Input Display -->
        <div id="keyboard-display" class="bg-white/10 px-6 py-3 rounded-2xl text-xl tracking-wide border border-white/20 min-h-[50px] flex items-center"></div>
        
        <!-- Keys -->
        <div id="keyboard-keys" class="grid grid-cols-10 gap-2 mt-4">
            <!-- Keys injected by JS -->
        </div>
        
        <!-- Bottom Row -->
        <div class="flex gap-2 mt-2">
            <button class="interactable flex-1 bg-white/10 py-4 rounded-xl font-bold" data-key="switch-123">123</button>
            <button class="interactable flex-1 bg-white/10 py-4 rounded-xl font-bold" data-key="switch-sym">#+=</button>
            <button class="interactable flex-[4] bg-white/10 py-4 rounded-xl" data-key=" ">Space</button>
            <button class="interactable flex-1 bg-red-500/20 py-4 rounded-xl text-red-500" data-key="backspace">⌫</button>
            <button class="interactable flex-1 bg-blue-500/20 py-4 rounded-xl text-blue-500" data-key="enter">GO</button>
        </div>
    </div>

    <div id="mic-overlay" class="absolute bottom-40 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none transition-all duration-500 hidden opacity-0 flex flex-col items-center">
        <div class="glass-panel px-8 py-6 rounded-[30px] flex flex-col items-center gap-4 min-w-[300px] border border-white/20 shadow-2xl bg-black/40">
            <div class="flex items-center gap-4">
                <div id="mic-indicator" class="w-4 h-4 rounded-full bg-red-500 animate-pulse"></div>
                <span id="mic-status" class="tracking-widest uppercase font-semibold text-center text-lg">Auto-Listening...</span>
            </div>
            <div id="mic-options" class="w-full text-left hidden flex flex-col gap-2 mt-2 pt-4 border-t border-white/20 text-md text-white/90"></div>
        </div>
    </div>

    <div id="spatial-cursor" class="spatial-cursor"></div>
    <div id="spatial-cursor-ring" class="spatial-cursor-ring"></div>
