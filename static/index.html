<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visionOS Web Clone - Ultimate</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Leaflet Map & Routing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-transparent backdrop-blur-[50px] border border-white/10 shadow-2xl;
            }
            .interactable {
                @apply transition-all duration-300 ease-out cursor-pointer;
            }
            .interactable.clicked {
                @apply scale-95 opacity-80;
            }
            .bg-gradient-1 { background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%); }
            .bg-gradient-2 { background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%); }
            .bg-gradient-4 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden bg-black select-none text-white transition-colors duration-500 dynamic-text tron-ares-bw">
    <div class="absolute inset-0 z-0">
        <video id="input_video" class="w-full h-full object-cover" autoplay playsinline></video>
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none scale-x-[-1] opacity-30"></canvas>
    </div>

    <!-- Left Sidebar Toolbar -->
    <div class="absolute top-8 left-8 z-50 pointer-events-auto flex flex-col gap-6">
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" id="settings-btn" title="Control Center">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" data-app="music" title="Music Player">
            <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" data-app="mic" id="btn-mic-toggle" title="Voice Search">
            <svg class="w-7 h-7 text-white" id="mic-icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        </div>
        <div class="interactable flex items-center justify-center w-14 h-14 rounded-full glass-panel hover:bg-white/20" data-app="map" title="Spatial Map">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="absolute top-8 left-28 z-50 pointer-events-auto bg-transparent backdrop-blur-[50px] border border-white/10 px-6 py-3 rounded-[30px] flex flex-row items-center gap-6 transition-all duration-300 opacity-0 -translate-x-4 pointer-events-none hidden">
        <div class="flex items-center gap-2">
            <span class="font-medium tracking-wide whitespace-nowrap">Border Color</span>
            <input type="color" id="border-color-picker" value="#ffffff" class="w-8 h-8 rounded-full border-none outline-none cursor-pointer bg-transparent">
        </div>
        <div class="flex items-center gap-2">
            <span class="font-medium tracking-wide whitespace-nowrap">Size</span>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-size-down">-</button>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-size-up">+</button>
        </div>
        <div class="flex items-center gap-2">
            <span class="font-medium tracking-wide whitespace-nowrap">Text</span>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-text-down">-</button>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-text-up">+</button>
        </div>
        <div class="flex items-center gap-2">
            <span class="font-medium tracking-wide whitespace-nowrap">Physics</span>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-hover-down">-</button>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-hover-up">+</button>
        </div>
        <div class="flex items-center gap-2">
            <span class="font-medium tracking-wide whitespace-nowrap">Zoom</span>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-zoom-down">-</button>
            <button class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center" id="btn-zoom-up">+</button>
        </div>
        <div class="flex items-center gap-2 border-l border-white/20 pl-4">
            <span class="font-bold tracking-wider text-xs uppercase opacity-70">Theme</span>
            <button class="interactable bg-white/10 hover:bg-white/20 px-2 py-1 rounded-full text-xs" id="btn-theme-normal">Normal</button>
            <button class="interactable bg-[#0ff]/20 hover:bg-[#0ff]/40 border border-[#0ff] text-[#0ff] px-2 py-1 rounded-full text-xs" id="btn-theme-legacy">B/BLK</button>
            <button class="interactable bg-[#ff003c]/20 hover:bg-[#ff003c]/40 border border-[#ff003c] text-[#ff003c] px-2 py-1 rounded-full text-xs" id="btn-theme-ares-rb">R/BLK</button>
            <button class="interactable bg-white/80 hover:bg-white border border-[#ff003c] text-[#ff003c] px-2 py-1 rounded-full text-xs font-bold" id="btn-theme-ares-rw">R/WHT</button>
            <button class="interactable bg-white/80 hover:bg-white border border-[#0284c7] text-[#0284c7] px-2 py-1 rounded-full text-xs font-bold" id="btn-theme-ares-bw">B/WHT</button>
        </div>
    </div>

    <!-- Music Player Window (Bottom Left) -->
    <div id="music-player" class="absolute bottom-8 left-8 z-40 pointer-events-auto flex flex-col items-start transition-all duration-500 hidden">
        <div class="music-bg glass-panel p-6 rounded-[32px] w-[400px] flex flex-col gap-4 relative">
            <div class="music-controls flex justify-between items-center w-full">
                <h3 class="font-semibold tracking-wide flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    Media Hub
                </h3>
                <div class="flex gap-2">
                    <button id="btn-min" class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <button id="btn-close" class="interactable bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>

            <!-- YouTube / Local Audio Controls -->
            <div class="music-controls flex flex-col gap-3 w-full">
                <div class="flex items-center gap-2 bg-white/10 rounded-full px-4 py-2 border border-white/20">
                    <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M21.582 6.186a2.697 2.697 0 00-1.895-1.905C17.983 3.82 12 3.82 12 3.82s-5.983 0-7.687.461a2.697 2.697 0 00-1.895 1.905C1.964 7.893 1.964 12 1.964 12s0 4.107.454 5.814a2.697 2.697 0 001.895 1.905C5.983 20.18 12 20.18 12 20.18s5.983 0 7.687-.461a2.697 2.697 0 001.895-1.905C22.036 16.107 22.036 12 22.036 12s0-4.107-.454-5.814zM9.996 15.005l0-6.01 5.378 3.006-5.378 3.004z"/></svg>
                    <input type="text" id="yt-link-input" placeholder="Paste YouTube Playlist URL..." class="bg-transparent outline-none border-none text-sm w-full text-white placeholder-white/50">
                    <button id="btn-yt-load" class="interactable text-xs font-bold px-2 py-1 bg-white/20 rounded-full hover:bg-white/30">LOAD</button>
                </div>

                <div class="flex justify-between items-center px-2 border-t border-white/10 pt-3">
                    <label class="interactable bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full cursor-pointer text-xs font-semibold flex items-center gap-1 border border-white/20">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Local MP3
                        <input type="file" id="music-file-input" accept="audio/*" class="hidden">
                    </label>

                    <div class="flex gap-2 items-center justify-center">
                        <!-- Loop button -->
                        <button id="btn-loop" class="interactable bg-white/10 hover:bg-white/30 w-8 h-8 rounded-full flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                        <!-- Play button -->
                        <button id="btn-play" class="interactable bg-white/20 hover:bg-white/40 w-12 h-12 rounded-full flex items-center justify-center shadow-lg border border-white/30">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- YT Iframe Container -->
            <div id="yt-player-container" class="hidden w-full h-[200px] rounded-2xl overflow-hidden shadow-inner mt-2">
                <iframe id="yt-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <!-- Audio Visualizer -->
            <canvas id="visualizer-canvas" width="350" height="60" class="mt-2"></canvas>
        </div>
        <audio id="audio-element" class="hidden"></audio>
    </div>

    <!-- Fullscreen Map Window -->
    <div id="map-window" class="absolute inset-0 z-30 pointer-events-auto flex items-center justify-center transition-all duration-500 hidden p-10">
        <div class="glass-panel p-2 rounded-[40px] w-full h-full flex flex-col relative overflow-hidden shadow-2xl">
            <!-- Map Top Bar: Search and Close -->
            <div class="absolute top-6 left-6 right-6 z-[999] flex justify-between items-start pointer-events-none">
                
                <!-- Search Bar -->
                <div class="pointer-events-auto flex gap-2">
                    <div class="flex items-center gap-2 bg-black/60 backdrop-blur rounded-full px-6 py-3 border border-white/20 shadow-lg">
                        <svg class="w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="map-search-input" placeholder="Search locations..." class="bg-transparent outline-none border-none text-lg w-64 text-white placeholder-white/50">
                        <button id="btn-map-search" class="interactable text-sm font-bold px-4 py-1.5 bg-white/20 rounded-full hover:bg-white/30 ml-2">GO</button>
                    </div>
                </div>

                <!-- Close Map -->
                <button id="btn-map-close" class="interactable pointer-events-auto bg-black/60 backdrop-blur text-white hover:bg-white/20 w-14 h-14 rounded-full flex items-center justify-center shadow-lg border border-white/20">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Big Zoom Controls -->
            <div class="absolute bottom-10 right-10 z-[999] flex flex-col gap-4">
                <button id="btn-map-zoom-in" class="interactable bg-black/60 backdrop-blur text-white hover:bg-white/20 w-16 h-16 rounded-full flex items-center justify-center shadow-2xl border border-white/20 text-3xl font-light">+</button>
                <button id="btn-map-zoom-out" class="interactable bg-black/60 backdrop-blur text-white hover:bg-white/20 w-16 h-16 rounded-full flex items-center justify-center shadow-2xl border border-white/20 text-3xl font-light">-</button>
            </div>

            <div id="map-container" class="w-full h-full rounded-[36px] overflow-hidden"></div>
        </div>
    </div>

    <!-- Mic/Voice Assistant Overlay -->
    <div id="mic-overlay" class="absolute bottom-40 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none transition-all duration-500 hidden opacity-0 flex flex-col items-center">
        <div class="glass-panel px-8 py-6 rounded-[30px] flex flex-col items-center gap-4 min-w-[300px] border border-white/20 shadow-2xl bg-black/40">
            <div class="flex items-center gap-4">
                <div id="mic-indicator" class="w-4 h-4 rounded-full bg-red-500 animate-pulse"></div>
                <span id="mic-status" class="tracking-widest uppercase font-semibold text-center text-lg">Auto-Listening...</span>
            </div>
            <div id="mic-options" class="w-full text-left hidden flex flex-col gap-2 mt-2 pt-4 border-t border-white/20 text-md text-white/90"></div>
        </div>
    </div>

    <!-- Removed Core App Dock per user request -->

    <!-- Custom Hand Cursor -->
    <div id="spatial-cursor" class="spatial-cursor"></div>
    <div id="spatial-cursor-ring" class="spatial-cursor-ring"></div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
