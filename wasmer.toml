[package]
name = "acer/graope-14"
version = "0.1.0"
description = "FastAPI application for Graope 14"

[[module]]
name = "server"
source = "python/python:3.11"

[[command]]
name = "run"
module = "server"
runner = "https://webc.org/runner/wasi"

[command.annotations]
wasi = { "main-args" = ["-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"] }

[fs]
"/" = "."
